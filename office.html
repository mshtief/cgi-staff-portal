<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="robots" content="noindex, nofollow">
  <title>Camp Office</title>
  <link rel="icon" href="assets/cgi-logo.png">
  <style>
    /* The camp office's own pages: the Yes / No page of a new application, and the offer page after an interview.
       This file is only the frame. What is shown comes from the hiring backend (backend/2027/Code.gs: decidePage,
       offerPage), which answers only to the signed link from an office email. Layout: one narrow column, as the
       backend's content is written for (520px, grey ground, white fields). */
    :root { --navy: #1e3a5f; --bg: #f5f7fa; --text: #111827; --muted: #6b7280; --border: #d1d5db; --red: #b91c1c; --red-soft: #fef2f2; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    .top { background: var(--navy); color: #fff; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .top .inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .top img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 10px; padding: 3px; flex-shrink: 0; }
    .top .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .top .sub { font-size: 12px; opacity: .8; }
    .wrap { max-width: 520px; margin: 0 auto; padding-block: 22px 56px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
    #root { min-width: 0; overflow-wrap: anywhere; }
    #root h2 { text-wrap: balance; }
    #root button:disabled { opacity: .55; cursor: default; }
    #root :focus-visible { outline: 3px solid rgba(30,58,95,.35); outline-offset: 2px; }
    .muted { color: var(--muted); font-size: 14px; text-align: center; }
    .banner { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 1s linear infinite; margin: 26px auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>

<header class="top">
  <div class="inner">
    <img src="assets/cgi-logo.png" alt="Camp Gan Israel Morristown">
    <div>
      <div class="brand">CGI Morristown</div>
      <div class="sub">Camp office · Staff 2027</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="trouble" hidden role="alert"></div>
  <div id="root"><div class="spinner" aria-hidden="true"></div><p class="muted">Opening…</p></div>
</main>

<script src="config.js"></script>
<script>
// The frame for the camp office's pages. It asks the hiring backend for the content that belongs to the link
// (action, id and the signed key k come from the email button), shows it, and sends the form on the page back
// with fetch, so the answer ("Sent ✓") appears right here. [2026-11-18: pages served by Apps Script itself could
// not show the answer after a button press.]
(function () {
  var BACKEND = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.applyBackendUrl) || '';
  var root = document.getElementById('root'), trouble = document.getElementById('trouble'), busy = false;
  function say(msg) { trouble.textContent = msg; trouble.hidden = !msg; if (msg) window.scrollTo(0, 0); }
  function plain(title, msg) {
    root.textContent = '';
    var h = document.createElement('h2'), p = document.createElement('p');
    h.style.margin = '0 0 10px'; h.textContent = title; p.textContent = msg; root.appendChild(h); root.appendChild(p);
  }
  function show(j) {
    root.innerHTML = j.html;                       // written by the backend (escaped values in fixed markup); reached only with a signed link
    document.title = (j.title ? j.title + ' – ' : '') + 'Camp Office';
    say(''); window.scrollTo(0, 0);
  }

  async function open() {
    var q = new URLSearchParams(location.search);
    if (!q.get('action') || !q.get('id') || !q.get('k')) return plain('Nothing to show here', 'This page opens from the buttons in the emails that the Staff Portal sends to the camp office.');
    if (!BACKEND) return plain('Not connected', 'This page is not connected to the hiring system yet.');
    q.set('via', 'page');
    for (var attempt = 1; attempt <= 3; attempt++) {
      try {
        var res = await fetch(BACKEND + '?' + q.toString());
        var j = await res.json();
        if (j && typeof j.html === 'string') return show(j);
        return plain('This did not open', (j && j.error) ? String(j.error) : 'The hiring system did not send the page. Please try the button in the email again.');
      } catch (err) { if (attempt < 3) await new Promise(function (r) { setTimeout(r, 1200 * attempt); }); }
    }
    plain('This did not open', 'The page could not reach the hiring system. Check the connection and open the button in the email again.');
  }

  // Every form on these pages goes back to the backend, and its answer replaces the page.
  root.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    var form = e.target, body = new URLSearchParams(new FormData(form)), btn = form.querySelector('button[type=submit]'), label = btn ? btn.textContent : '';
    body.set('via', 'page');
    busy = true; say(''); if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
    try {
      var res = await fetch(BACKEND, { method: 'POST', body: body });
      var j = await res.json();
      if (j && typeof j.html === 'string') show(j);
      else throw new Error((j && j.error) ? String(j.error) : 'no answer');
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = label; }
      say('That did not go through (' + (err && err.message ? err.message : 'no connection') + '). Before you try again, open the row in Staff 2027 and look at the status: it may have gone out already.');
    }
    busy = false;
  });

  open();
})();
</script>
</body>
</html>
